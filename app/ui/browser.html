<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Vexon</title>
<style>
/* Vexon palette: purple #A855F7, cyan #00E5FF, ink #0A0A0C, white. The light theme uses a deeper
   purple/cyan so text and icons keep their contrast on white. */
:root {
  --frame: #ece8f5; --bar: #ffffff; --omni: #f3f0f9; --omni-hover: #e9e4f3; --hover: rgba(10,10,12,.08);
  --text: #0a0a0c; --muted: #5c5c6b; --faint: #8b8b9a; --line: #ddd8ea; --accent: #9333ea; --cyan: #00b8d4;
  --accent-soft: #f1e6fd; --rec: #d92b4b; --ok: #0891b2; --warn: #d97706;
  --tab-hover: rgba(255,255,255,.6); --sep: #9c98ab; --sel: #f1e6fd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --frame: #0a0a0c; --bar: #17171d; --omni: #0a0a0c; --omni-hover: #1f1f27; --hover: rgba(255,255,255,.09);
    --text: #f4f4f8; --muted: #a3a3b2; --faint: #6f6f80; --line: #2b2b35; --accent: #a855f7; --cyan: #00e5ff;
    --accent-soft: #2b1a45; --rec: #ff5c7a; --ok: #00e5ff; --warn: #ffc857;
    --tab-hover: rgba(255,255,255,.07); --sep: #3a3a46; --sel: #2b1a45;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font: 12px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text);
  -webkit-user-select: none; user-select: none; cursor: default; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---- tab strip ---- */
#strip { height: 40px; padding: 6px 8px 0; background: var(--frame); display: flex; align-items: flex-end; }
#tabs { display: flex; align-items: flex-end; min-width: 0; flex: 0 1 auto; }
.tab { position: relative; height: 34px; flex: 0 1 240px; min-width: 38px; width: 240px; display: flex; align-items: center;
  gap: 8px; padding: 0 8px 0 12px; border-radius: 10px 10px 0 0; color: var(--muted); overflow: visible; }
.tab:hover:not(.active) { background: var(--tab-hover); border-radius: 10px; margin-bottom: 4px; height: 30px; }
.tab.active { background: var(--bar); color: var(--text); z-index: 2; box-shadow: inset 0 2px 0 var(--accent); }
.tab.active::before, .tab.active::after { content: ""; position: absolute; bottom: 0; width: 10px; height: 10px; pointer-events: none; }
.tab.active::before { left: -10px; background: radial-gradient(circle at 0 0, transparent 9.5px, var(--bar) 10px); }
.tab.active::after { right: -10px; background: radial-gradient(circle at 100% 0, transparent 9.5px, var(--bar) 10px); }
.tab .sep { position: absolute; left: -1px; top: 8px; bottom: 8px; width: 1px; background: var(--sep); opacity: .55; }
.tab:first-child .sep, .tab.active .sep, .tab.active + .tab .sep, .tab:hover .sep, .tab:hover + .tab .sep { opacity: 0; }
.tab .fav { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.tab .fav img { width: 16px; height: 16px; border-radius: 3px; }
.tab .fav svg { width: 16px; height: 16px; opacity: .7; }
.tab .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: clip;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent); }
.tab .x { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--muted); }
.tab .x svg { width: 12px; height: 12px; }
.tab .x:hover { background: var(--hover); color: var(--text); }
.tab:not(.active) .x { display: none; }
.tab:not(.active):hover .x { display: grid; }
.tab.narrow .title { display: none; }
.tab.narrow:not(.active) .fav { margin: 0 auto; }
.tab.narrow:not(.active) { padding: 0; justify-content: center; }
.tab.narrow.active { padding: 0 4px; justify-content: space-between; }
.tab.dragging { z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.25); transition: none; opacity: .95; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent);
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tab { animation: tabin .12s ease-out; }
@keyframes tabin { from { opacity: 0; transform: translateY(4px); } }
#newtab { width: 28px; height: 28px; margin: 0 0 3px 6px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--muted); }
#newtab:hover { background: var(--hover); color: var(--text); }
#newtab svg { width: 16px; height: 16px; }

/* ---- toolbar ---- */
#toolbar { position: relative; height: 40px; background: var(--bar); display: flex; align-items: center; gap: 2px; padding: 0 8px; }
.tb { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--muted); position: relative; }
.tb svg { width: 20px; height: 20px; }
.tb:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.tb:disabled { opacity: .38; }
.tb.on { color: var(--accent); background: var(--accent-soft); }
#omni { flex: 1; min-width: 80px; height: 32px; margin: 0 6px; border-radius: 16px; background: var(--omni); display: flex; align-items: center;
  padding: 0 4px; position: relative; }
#omni:hover { background: var(--omni-hover); }
#omni.focus { background: var(--bar); box-shadow: inset 0 0 0 2px var(--accent); }
#site { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
#site svg { width: 16px; height: 16px; }
#site.bad { color: var(--warn); }
#site:hover { background: var(--hover); }
#url { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: text; user-select: text; padding: 0 4px; }
#url::placeholder { color: var(--muted); }
#star { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
#star svg { width: 18px; height: 18px; }
#star:hover:not(:disabled) { background: var(--hover); }
#star:disabled { opacity: .35; }
#star.on { color: var(--accent); }
#star.on svg { fill: currentColor; }
#progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; display: none; }
#progress.on { display: block; }
#progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, var(--accent), var(--cyan)); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { left: -30%; } to { left: 100%; } }
#mic .dot { position: absolute; right: 5px; bottom: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); border: 2px solid var(--bar); box-sizing: content-box; margin: -2px; }
#mic .dot.ready { background: var(--ok); }
#mic .dot.loading, #mic .dot.transcribing { background: var(--warn); animation: pulse 1s infinite; }
#mic .dot.recording { background: var(--rec); animation: pulse .6s infinite; }
#mic .dot.error { background: var(--rec); }
@keyframes pulse { 50% { opacity: .35; } }

/* ---- bookmarks bar ---- */
#bmbar { height: 32px; background: var(--bar); border-bottom: 1px solid var(--line); display: none; align-items: center; padding: 0 8px; gap: 2px; }
#bmbar.on { display: flex; }
#bms { display: flex; align-items: center; min-width: 0; flex: 1; overflow: hidden; }
.bm { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 13px; max-width: 170px; flex: none; color: var(--text); }
.bm:hover { background: var(--hover); }
.bm img, .bm svg { width: 16px; height: 16px; flex: none; border-radius: 3px; }
.bm svg { color: var(--muted); }
.bm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm-hint { color: var(--faint); padding: 0 8px; }
#bmmore { width: 26px; height: 26px; border-radius: 13px; flex: none; display: grid; place-items: center; color: var(--muted); }
#bmmore[hidden] { display: none; }
#bmmore:hover { background: var(--hover); color: var(--text); }
#bmmore svg { width: 16px; height: 16px; }
#overflow { right: 150px; top: 112px; max-width: 320px; max-height: 360px; overflow-y: auto; }
#allbm { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; flex: none; margin-left: 6px; border-left: 1px solid var(--line); border-radius: 0 13px 13px 0; }
#allbm:hover { background: var(--hover); }
#allbm svg { width: 16px; height: 16px; color: var(--muted); }

/* ---- popups (menus, address suggestions): drawn in the shell, over the page ---- */
.popup { position: fixed; z-index: 50; background: var(--bar); border: 1px solid var(--line); border-radius: 12px; padding: 6px 0; font-size: 13px; }
.popup[hidden] { display: none; }
#menu { min-width: 280px; right: 8px; top: 82px; }
.mi { display: flex; align-items: center; height: 34px; padding: 0 16px; gap: 12px; }
.mi:hover { background: var(--hover); }
.mi .k { margin-left: auto; color: var(--faint); font-size: 12px; padding-left: 24px; }
.mi .chk { width: 16px; height: 16px; flex: none; }
.mi.zoom { cursor: default; }
.mi.zoom:hover { background: none; }
.zbtn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
.zbtn:hover { background: var(--hover); }
.zbtn svg { width: 16px; height: 16px; }
.msep { height: 1px; background: var(--line); margin: 6px 0; }
#suggest { padding: 8px 0; }
.sg { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 16px 0 14px; }
.sg.sel { background: var(--sel); }
.sg .ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; color: var(--muted); }
.sg .ic img { width: 16px; height: 16px; border-radius: 3px; }
.sg .ic svg { width: 16px; height: 16px; }
.sg .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.sg .u { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.sg .u::before { content: "\2013\00a0"; color: var(--faint); }
#ctx { min-width: 190px; }
#acct .dot { position: absolute; right: 4px; bottom: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bar); box-sizing: content-box; margin: -2px; }
#acct .dot[hidden] { display: none; }
#acctmenu { width: 320px; right: 8px; top: 82px; padding: 16px 0 8px; }
.acct-head { display: flex; gap: 14px; align-items: center; padding: 0 20px 14px; }
.acct-head b { display: block; font-size: 14px; font-weight: 600; }
.acct-head span { color: var(--muted); font-size: 12.5px; line-height: 1.4; display: block; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 600; flex: none; }
.avatar.on { background: var(--ok); color: #0a0a0c; }
.gbtn { display: block; margin: 0 20px 12px; height: 38px; width: calc(100% - 40px); border-radius: 19px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13.5px; }
.gbtn:hover { filter: brightness(1.08); }
.note { padding: 4px 20px 6px; color: var(--faint); font-size: 12px; line-height: 1.4; }
</style>
</head>
<body>

<div id="chrome">
  <div id="strip">
    <div id="tabs"></div>
    <button id="newtab" title="New tab (Ctrl+T)" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div id="toolbar">
    <button class="tb" id="back" title="Back (Alt+Left)" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <button class="tb" id="fwd" title="Forward (Alt+Right)" aria-label="Forward" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button class="tb" id="reload" title="Reload (F5)" aria-label="Reload"></button>

    <div id="omni">
      <button id="site" tabindex="-1" aria-label="Site information"></button>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or type a URL" aria-label="Address and search bar">
      <button id="star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
    </div>

    <button class="tb" id="mic" title="Vexon dictation" aria-label="Vexon dictation"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg><span class="dot" id="micdot"></span></button>
    <button class="tb" id="acct" title="Google account" aria-label="Google account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="dot" id="acctdot" hidden></span></button>
    <button class="tb" id="menubtn" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
    <div id="progress"></div>
  </div>

  <div id="bmbar">
    <div id="bms"></div>
    <button id="bmmore" title="More bookmarks" aria-label="More bookmarks" hidden><svg viewBox="0 0 24 24"><path d="m6 7 5 5-5 5M13 7l5 5-5 5"/></svg></button>
    <button id="allbm" title="Open the bookmarks manager (Ctrl+Shift+O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>All bookmarks</button>
  </div>
</div>

<div class="popup" id="suggest" hidden></div>
<div class="popup" id="menu" hidden></div>
<div class="popup" id="ctx" hidden></div>
<div class="popup" id="overflow" hidden></div>
<div class="popup" id="acctmenu" hidden></div>

<script src="keys.js"></script>
<script>
const $ = s => document.querySelector(s);
const ENGINES = {google: 'Google', duckduckgo: 'DuckDuckGo', bing: 'Bing', brave: 'Brave Search'};
const SVG = a => `<svg viewBox="0 0 24 24">${a}</svg>`;
const ICON = {
  reload: SVG('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'),
  stop: SVG('<path d="M18 6 6 18M6 6l12 12"/>'),
  lock: SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  warn: SVG('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.4"/>'),
  search: SVG('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  globe: SVG('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
  clock: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  star: SVG('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'),
  minus: SVG('<path d="M5 12h14"/>'), plus: SVG('<path d="M12 5v14M5 12h14"/>'),
  check: SVG('<path d="m5 12 5 5 9-10"/>'),
  close: SVG('<path d="M18 6 6 18M6 6l12 12"/>'),
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let api, cfg = {}, st = {tabs: [], active: null, bookmarked: false}, bookmarks = [];
let editing = false, dragging = false, sugg = [], sel = -1, typed = '', suggSeq = 0;
const active = () => st.tabs.find(t => t.id === st.active);

/* ------------------------------------------------------------------ popups & layout */
const popups = new Set();
function reportLayout(wait) {
  if (!api) return Promise.resolve();
  const rects = [...popups].map(el => { const r = el.getBoundingClientRect();
    return [Math.floor(r.left), Math.floor(r.top), Math.ceil(r.width) + 1, Math.ceil(r.height) + 1]; });
  return api.set_layout(Math.ceil($('#chrome').getBoundingClientRect().height), rects);
}
async function showPopup(el) {
  el.style.visibility = 'hidden'; el.hidden = false; popups.add(el);
  await reportLayout(true);           // the native window region must include the popup before it is visible
  el.style.visibility = '';
}
function hidePopup(el) { if (el.hidden) return; el.hidden = true; popups.delete(el); reportLayout(); }
function closePopups(except) { [$('#suggest'), $('#menu'), $('#ctx'), $('#overflow'), $('#acctmenu')].forEach(el => el !== except && hidePopup(el)); }
new ResizeObserver(() => reportLayout()).observe($('#chrome'));
addEventListener('blur', () => { closePopups(); });
addEventListener('pointerdown', e => {
  if (!e.target.closest('.popup') && !e.target.closest('#menubtn') && !e.target.closest('#omni')) closePopups();
}, true);
addEventListener('contextmenu', e => { if (!e.target.closest('#url')) e.preventDefault(); });

/* ------------------------------------------------------------------ tabs */
function favHtml(t) {
  if (t.loading) return '<div class="spin"></div>';
  if (t.internal) return '<img src="icon.png" alt="">';
  if (t.favicon) return `<img src="${esc(t.favicon)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICON.globe}))">`;
  return ICON.globe;
}
function makeTab(t) {
  const el = document.createElement('div');
  el.className = 'tab'; el.dataset.id = t.id;
  el.innerHTML = '<i class="sep"></i><span class="fav"></span><span class="title"></span>' +
    `<button class="x" title="Close tab (Ctrl+W)" aria-label="Close tab">${ICON.close}</button>`;
  return el;
}
function renderTabs() {
  if (dragging) return;
  const box = $('#tabs'), live = new Set();
  st.tabs.forEach((t, i) => {
    live.add(String(t.id));
    let el = box.querySelector(`.tab[data-id="${t.id}"]`);
    if (!el) el = makeTab(t);
    el.classList.toggle('active', t.id === st.active);
    el.title = t.title + (t.address ? '\n' + t.address : '');
    const key = (t.loading ? 'L' : '') + (t.internal ? 'I' : '') + t.favicon;
    if (el._fav !== key) { el.querySelector('.fav').innerHTML = favHtml(t); el._fav = key; }
    el.querySelector('.title').textContent = t.title;
    if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
  });
  [...box.children].forEach(el => { if (!live.has(el.dataset.id)) el.remove(); });
  fitTabs();
}
function fitTabs() {
  const strip = $('#strip').clientWidth - 16 - 40, n = Math.max(1, st.tabs.length);
  const w = Math.max(38, Math.min(240, Math.floor(strip / n)));
  document.querySelectorAll('.tab').forEach(el => { el.style.width = w + 'px'; el.classList.toggle('narrow', w < 90); });
}
addEventListener('resize', fitTabs);

$('#tabs').addEventListener('pointerdown', e => {
  const el = e.target.closest('.tab');
  if (!el || e.button !== 0 || e.target.closest('.x')) return;
  const id = +el.dataset.id;
  if (id !== st.active) api.activate_tab(id);
  // drag to reorder: the dragged tab follows the pointer, its neighbours slide aside
  const box = $('#tabs'), startX = e.clientX, tabs = [...box.children];
  const from = tabs.indexOf(el), w = el.offsetWidth; let moved = false, to = from;
  const move = ev => {
    const dx = ev.clientX - startX;
    if (!moved && Math.abs(dx) < 6) return;
    if (!moved) { moved = true; dragging = true; el.classList.add('dragging'); el.setPointerCapture(e.pointerId); }
    el.style.transform = `translateX(${dx}px)`;
    to = Math.max(0, Math.min(tabs.length - 1, Math.round(from + dx / w)));
    tabs.forEach((s, i) => {
      if (s === el) return;
      const off = (to > from && i > from && i <= to) ? -w : (to < from && i >= to && i < from) ? w : 0;
      s.style.transition = 'transform .12s'; s.style.transform = off ? `translateX(${off}px)` : '';
    });
  };
  const up = () => {
    el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up);
    el.removeEventListener('pointercancel', up);
    if (!moved) return;
    tabs.forEach(s => { s.style.transform = ''; s.style.transition = ''; });
    el.classList.remove('dragging');
    if (to !== from) box.insertBefore(el, (to > from ? tabs[to].nextSibling : tabs[to]));
    dragging = false;
    if (to !== from) api.move_tab(id, to);
  };
  el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
});
$('#tabs').addEventListener('click', e => {
  const x = e.target.closest('.x');
  if (x) api.close_tab(+x.closest('.tab').dataset.id);
});
$('#tabs').addEventListener('auxclick', e => {
  const el = e.target.closest('.tab');
  if (el && e.button === 1) api.close_tab(+el.dataset.id);
});
$('#newtab').onclick = () => api.new_tab();

/* ------------------------------------------------------------------ toolbar */
$('#reload').innerHTML = ICON.reload;
// like Chrome, keyboard focus returns to the page after a navigation button
$('#back').onclick = () => { api.go_back(); api.focus_content(); };
$('#fwd').onclick = () => { api.go_forward(); api.focus_content(); };
$('#reload').onclick = () => { const t = active(); if (t && t.loading) api.stop_loading(); else api.reload_page(false); api.focus_content(); };
$('#star').onclick = () => api.toggle_bookmark();
$('#mic').onclick = () => api.open_internal('app');

function renderToolbar() {
  const t = active();
  $('#back').disabled = !(t && t.back);
  $('#fwd').disabled = !(t && t.forward);
  const loading = !!(t && t.loading);
  $('#reload').innerHTML = loading ? ICON.stop : ICON.reload;
  $('#reload').title = loading ? 'Stop loading (Esc)' : 'Reload (F5)';
  $('#progress').classList.toggle('on', loading);
  const web = !!(t && !t.internal && t.address);
  $('#star').disabled = !web;
  $('#star').classList.toggle('on', web && st.bookmarked);
  $('#star').title = st.bookmarked ? 'Remove bookmark (Ctrl+D)' : 'Bookmark this page (Ctrl+D)';
  const site = $('#site');
  site.classList.toggle('bad', web && !t.secure);
  site.innerHTML = !t || !t.address || t.internal ? ICON.search : (t.secure ? ICON.lock : ICON.warn);
  site.title = web ? (t.secure ? 'Connection is secure' : 'Connection is not secure') : '';
  $('#url').placeholder = `Search ${ENGINES[cfg.search_engine] || 'Google'} or type a URL`;
  if (!editing) $('#url').value = !t ? '' : (document.activeElement === $('#url') ? t.edit : t.address);
}

/* ------------------------------------------------------------------ address bar */
const url = $('#url');
url.addEventListener('focus', () => {
  $('#omni').classList.add('focus');
  const t = active(); if (t && !editing) url.value = t.edit;
  url.select();
});
url.addEventListener('blur', () => {
  $('#omni').classList.remove('focus');
  editing = false; hidePopup($('#suggest'));
  const t = active(); url.value = t ? t.address : '';
});
url.addEventListener('mouseup', e => e.preventDefault());
url.addEventListener('input', () => {
  editing = true; typed = url.value; sel = -1; askSuggest(typed);
});
url.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!sugg.length) return;
    e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + sugg.length + 1) % (sugg.length + 1);
    if (sel === sugg.length) sel = -1;
    paintSuggest();
    url.value = sel < 0 ? typed : (sugg[sel].kind === 'search' ? sugg[sel].title : sugg[sel].url);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const target = sel >= 0 ? sugg[sel].url : url.value;
    editing = false; hidePopup($('#suggest'));
    url.blur();                               // like Chrome: focus goes to the page
    if (e.altKey) api.new_tab(target); else api.navigate(target);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    if (!$('#suggest').hidden) { hidePopup($('#suggest')); url.value = typed || url.value; }
    else { editing = false; const t = active(); url.value = t ? t.edit : ''; url.select(); api.focus_content(); }
  }
});
async function askSuggest(text) {
  const seq = ++suggSeq;
  if (!text.trim()) { sugg = []; hidePopup($('#suggest')); return; }
  const list = await api.suggest(text);
  if (seq !== suggSeq || !editing) return;
  sugg = list; paintSuggest();
}
function paintSuggest() {
  const el = $('#suggest');
  if (!sugg.length) { hidePopup(el); return; }
  const r = $('#omni').getBoundingClientRect();
  el.style.left = r.left + 'px'; el.style.top = (r.bottom + 4) + 'px'; el.style.width = r.width + 'px';
  el.innerHTML = sugg.map((s, i) => {
    let ic;
    if (s.kind === 'search') ic = ICON.search;
    else if (s.kind === 'url') ic = ICON.globe;
    else if (s.icon) ic = `<img src="${esc(s.icon)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICON.globe}))">`;
    else ic = s.kind === 'bookmark' ? ICON.star : ICON.clock;
    const text = s.kind === 'search' ? `<span class="t">${esc(s.title)}</span><span class="u">${esc(s.sub)}</span>`
      : s.kind === 'url' ? `<span class="t">${esc(s.title)}</span><span class="u">${esc(s.sub)}</span>`
      : `<span class="t">${esc(s.title)}</span><span class="u">${esc(s.url.replace(/^https?:\/\//, ''))}</span>`;
    return `<div class="sg${i === sel ? ' sel' : ''}" data-i="${i}"><span class="ic">${ic}</span>${text}</div>`;
  }).join('');
  if (el.hidden) showPopup(el); else reportLayout();
}
$('#suggest').addEventListener('mousedown', e => {
  e.preventDefault();                        // keep focus in the address bar
  const row = e.target.closest('.sg'); if (!row) return;
  const s = sugg[+row.dataset.i];
  editing = false; hidePopup($('#suggest'));
  url.blur();
  api.navigate(s.url);
});

/* ------------------------------------------------------------------ bookmarks bar */
function favImg(src) {
  return src ? `<img src="${esc(src)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICON.globe}))">` : ICON.globe;
}
function renderBookmarks() {
  const on = cfg.show_bookmarks_bar !== false;
  $('#bmbar').classList.toggle('on', on);
  $('#bms').innerHTML = bookmarks.length
    ? bookmarks.map(b => `<a class="bm" data-id="${b.id}" data-url="${esc(b.url)}" title="${esc(b.title)}\n${esc(b.url)}">${favImg(b.icon)}<span>${esc(b.title)}</span></a>`).join('')
    : '<span class="bm-hint">Bookmarks you add appear here. Press the star in the address bar or Ctrl+D.</span>';
  fitBookmarks();
  requestAnimationFrame(() => reportLayout());
}
// Bookmarks that do not fit move into a » menu, like Chrome
let overflowed = [];
function fitBookmarks() {
  const box = $('#bms'), items = [...box.querySelectorAll('.bm')];
  items.forEach(el => el.style.display = '');
  overflowed = [];
  const total = items.reduce((n, el) => n + el.offsetWidth, 0);
  if (total > box.clientWidth) {
    let used = 0;
    items.forEach(el => {                       // keep 30px free for the » button
      used += el.offsetWidth;
      if (used > box.clientWidth - 30) { el.style.display = 'none'; overflowed.push(bookmarks.find(b => String(b.id) === el.dataset.id)); }
    });
  }
  $('#bmmore').hidden = !overflowed.length;
}
new ResizeObserver(() => fitBookmarks()).observe($('#bmbar'));
$('#bmmore').onclick = () => {
  const el = $('#overflow');
  if (!el.hidden) { hidePopup(el); return; }
  el.innerHTML = overflowed.map(b => `<a class="mi" data-url="${esc(b.url)}" title="${esc(b.url)}"><span style="width:16px;height:16px;flex:none">${favImg(b.icon)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.title)}</span></a>`).join('');
  const r = $('#bmmore').getBoundingClientRect();
  el.style.right = Math.max(8, innerWidth - r.right - 4) + 'px'; el.style.left = ''; el.style.top = (r.bottom + 4) + 'px';
  closePopups(el); showPopup(el);
};
$('#overflow').addEventListener('click', e => {
  const a = e.target.closest('[data-url]'); if (!a) return;
  hidePopup($('#overflow'));
  if (e.ctrlKey) api.new_tab(a.dataset.url); else api.navigate(a.dataset.url);
});
$('#bms').addEventListener('click', e => {
  const b = e.target.closest('.bm'); if (!b) return;
  if (e.ctrlKey) api.new_tab(b.dataset.url); else api.navigate(b.dataset.url);
});
$('#bms').addEventListener('auxclick', e => {
  const b = e.target.closest('.bm'); if (b && e.button === 1) api.new_tab(b.dataset.url);
});
$('#bms').addEventListener('contextmenu', e => {
  const b = e.target.closest('.bm'); if (!b) return;
  const el = $('#ctx');
  el.innerHTML = '<div class="mi" data-a="open">Open in new tab</div><div class="mi" data-a="del">Delete</div>';
  el.dataset.id = b.dataset.id; el.dataset.url = b.dataset.url;
  el.style.left = Math.min(e.clientX, innerWidth - 200) + 'px'; el.style.top = (e.clientY + 4) + 'px';
  closePopups(el); showPopup(el);
});
$('#ctx').addEventListener('click', e => {
  const a = e.target.closest('.mi'); if (!a) return;
  const el = $('#ctx');
  if (a.dataset.a === 'open') api.new_tab(el.dataset.url);
  if (a.dataset.a === 'del') api.remove_bookmark(+el.dataset.id);
  hidePopup(el);
});
$('#allbm').onclick = () => api.open_internal('bookmarks');

/* ------------------------------------------------------------------ menu */
function buildMenu() {
  const bar = cfg.show_bookmarks_bar !== false;
  return `
    <div class="mi" data-c="new_tab">New tab<span class="k">Ctrl+T</span></div>
    <div class="mi" data-c="reopen_tab">Reopen closed tab<span class="k">Ctrl+Shift+T</span></div>
    <div class="msep"></div>
    <div class="mi" data-c="bookmarks">Bookmarks<span class="k">Ctrl+Shift+O</span></div>
    <div class="mi" data-c="history">History<span class="k">Ctrl+H</span></div>
    <div class="mi" data-c="toggle_bookmarks_bar"><span class="chk">${bar ? ICON.check : ''}</span>Show bookmarks bar<span class="k">Ctrl+Shift+B</span></div>
    <div class="msep"></div>
    <div class="mi zoom">Zoom<span class="k" style="display:flex;gap:2px;padding-left:0">
      <button class="zbtn" data-z="-0.1" title="Zoom out">${ICON.minus}</button>
      <button class="zbtn" data-z="0" title="Reset zoom" style="width:auto;padding:0 8px">Reset</button>
      <button class="zbtn" data-z="0.1" title="Zoom in">${ICON.plus}</button></span></div>
    <div class="mi" data-c="print">Print…<span class="k">Ctrl+P</span></div>
    <div class="mi" data-c="devtools">Developer tools<span class="k">F12</span></div>
    <div class="msep"></div>
    <div class="mi" data-c="app">Vexon dictation</div>`;
}
$('#menubtn').onclick = () => {
  const el = $('#menu');
  if (!el.hidden) { hidePopup(el); return; }
  el.innerHTML = buildMenu(); closePopups(el); showPopup(el);
};
$('#menu').addEventListener('click', e => {
  const z = e.target.closest('.zbtn');
  if (z) { api.zoom_page(+z.dataset.z); return; }
  const m = e.target.closest('.mi[data-c]'); if (!m) return;
  hidePopup($('#menu'));
  const c = m.dataset.c;
  if (c === 'print') api.print_page(); else if (c === 'devtools') api.dev_tools(); else api.browser_command(c);
  if (c === 'print' || c === 'devtools') setTimeout(() => api.focus_content(), 50);
});

/* ------------------------------------------------------------------ Google account (Gmail sign-in) */
// Signing in happens on Google's own page in a tab; Vexon keeps the session in its profile.
// "Signed in" means the profile holds a Google session cookie.
let google = {signed_in: false, sign_in_url: 'https://accounts.google.com/'}, googleCheck = 0, lastGoogleUrl = '';
async function refreshGoogle() {
  const mine = ++googleCheck;
  try { google = await api.google_account(); } catch (e) { return; }
  if (mine !== googleCheck) return;
  $('#acctdot').hidden = !google.signed_in;
  $('#acct').title = google.signed_in ? 'Google account - signed in' : 'Google account - sign in';
}
function buildAccountMenu() {
  const note = '<div class="note">Bookmarks and history stay on this PC. They are not synced to your Google account.</div>';
  if (google.signed_in) return `
    <div class="acct-head"><div class="avatar on">G</div><div><b>Signed in to Google</b><span>Your Google session is saved in Vexon.</span></div></div>
    <div class="mi" data-go="https://mail.google.com/">Open Gmail</div>
    <div class="mi" data-go="https://myaccount.google.com/">Manage your Google Account</div>
    <div class="mi" data-go="https://accounts.google.com/Logout?continue=https://www.google.com/">Sign out</div>
    <div class="msep"></div>${note}`;
  return `
    <div class="acct-head"><div class="avatar">G</div><div><b>Not signed in</b><span>Sign in to use Gmail and other Google services in Vexon.</span></div></div>
    <button class="gbtn" data-go="${esc(google.sign_in_url)}">Sign in to Google</button>
    <div class="mi" data-go="https://mail.google.com/">Open Gmail</div>
    <div class="msep"></div>${note}`;
}
$('#acct').onclick = async () => {
  const el = $('#acctmenu');
  if (!el.hidden) { hidePopup(el); return; }
  await refreshGoogle();
  el.innerHTML = buildAccountMenu(); closePopups(el); showPopup(el);
};
$('#acctmenu').addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (!go) return;
  hidePopup($('#acctmenu'));
  api.new_tab(go.dataset.go);
});

/* ------------------------------------------------------------------ keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && popups.size) { closePopups(); return; }
  let cmd = vtKeyCommand(e);
  if (cmd === 'focus_address') { e.preventDefault(); focusAddress(); return; }
  if (cmd) { e.preventDefault(); api.browser_command(cmd); return; }
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  if (k === 'F5' || (ctrl && !e.altKey && !e.shiftKey && k.toLowerCase() === 'r')) { e.preventDefault(); api.reload_page(e.ctrlKey && k === 'F5'); }
  else if (ctrl && k.toLowerCase() === 'r' && e.shiftKey) { e.preventDefault(); api.reload_page(true); }
  else if (e.altKey && k === 'ArrowLeft') { e.preventDefault(); api.go_back(); }
  else if (e.altKey && k === 'ArrowRight') { e.preventDefault(); api.go_forward(); }
  else if (k === 'Escape' && !editing) { const t = active(); if (t && t.loading) api.stop_loading(); }
  else if (ctrl && k.toLowerCase() === 'p') { e.preventDefault(); api.print_page(); }
  else if (k === 'F12') { e.preventDefault(); api.dev_tools(); }
  else if (ctrl && (k === '+' || k === '=')) { e.preventDefault(); api.zoom_page(0.1); }
  else if (ctrl && k === '-') { e.preventDefault(); api.zoom_page(-0.1); }
  else if (ctrl && k === '0') { e.preventDefault(); api.zoom_page(0); }
});
function focusAddress() { url.focus(); url.select(); }

/* ------------------------------------------------------------------ events from Python */
window.onBrowserEvent = (event, data) => {
  if (event === 'tabs') {
    const switched = st.active !== data.active;
    st = data;
    if (switched) editing = false;
    renderTabs(); renderToolbar();
    const t = active();                           // a Google page just finished: the sign-in state may have changed
    if (t && !t.loading && t.url !== lastGoogleUrl && /(^|\.)google\.com\//.test(t.address + '/')) {
      lastGoogleUrl = t.url; refreshGoogle();
    }
  } else if (event === 'bookmarks') {
    bookmarks = data; renderBookmarks();
  } else if (event === 'focus_address') {
    if (editing) url.focus(); else focusAddress();      // never select away text already being typed
  }
};
function setMic(state, status) {
  $('#micdot').className = 'dot ' + state;
  $('#mic').title = 'Vexon dictation - ' + status;
}
window.onEngineEvent = (event, data) => {
  if (event === 'state') setMic(data.state, data.status);
  if (event === 'config') { cfg = data; renderBookmarks(); renderToolbar(); }
};

window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  const s = await api.get_state();
  cfg = s.config; setMic(s.state, s.status);
  bookmarks = await api.get_bookmarks();
  st = await api.browser_state();
  renderBookmarks(); renderTabs(); renderToolbar(); reportLayout();
  refreshGoogle();
});
</script>
</body>
</html>
