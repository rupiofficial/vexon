<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<div class="head"><div class="head-in">
  <h1>Bookmarks</h1>
  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search bookmarks" autofocus>
  </label>
</div></div>
<main id="list"></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GLOBE = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
const TRASH = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>';
const PEN = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
let api, timer, rows = [];
const icon = b => b.icon ? `<img src="${esc(b.icon)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:GLOBE}))">` : GLOBE;

async function load() {
  const q = $('#q').value.trim();
  rows = await api.get_bookmarks(q);
  const box = $('#list');
  if (!rows.length) {
    box.innerHTML = `<div class="empty">${q ? 'No matching bookmarks.' : 'No bookmarks yet. Open a page and press the star in the address bar, or Ctrl+D.'}</div>`;
    return;
  }
  box.innerHTML = '<div class="card" style="margin-top:20px">' + rows.map(b => `
    <div class="row" data-id="${b.id}">
      <span class="ico">${icon(b)}</span>
      <a class="main" href="${esc(b.url)}" title="${esc(b.url)}"><span class="t">${esc(b.title)}</span><span class="u">${esc(b.url.replace(/^https?:\/\//, ''))}</span></a>
      <span class="acts">
        <button class="ib" data-edit title="Rename" aria-label="Rename">${PEN}</button>
        <button class="ib" data-del title="Delete" aria-label="Delete">${TRASH}</button></span></div>`).join('') + '</div>';
}
$('#list').addEventListener('click', async e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = +row.dataset.id;
  if (e.target.closest('[data-del]')) { await api.remove_bookmark(id); return; }
  if (e.target.closest('[data-edit]')) {
    const b = rows.find(x => x.id === id), main = row.querySelector('.main');
    const input = Object.assign(document.createElement('input'), {className: 'rename', value: b.title});
    main.replaceWith(input); input.focus(); input.select();
    let done = false;
    const finish = async save => {
      if (done) return; done = true;
      if (save && input.value.trim() && input.value.trim() !== b.title) await api.rename_bookmark(id, input.value.trim());
      else load();
    };
    input.onkeydown = ev => { if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') finish(false); };
    input.onblur = () => finish(true);
  }
});
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 150); });
window.onEngineEvent = event => { if (event === 'bookmarks') load(); };
window.addEventListener('pywebviewready', () => { api = window.pywebview.api; load(); });
</script>
</body>
</html>
