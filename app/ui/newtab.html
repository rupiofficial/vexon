<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="pages.css">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.top { align-self: stretch; display: flex; justify-content: flex-end; padding: 8px 16px 0; }
.top { align-items: center; gap: 4px; }
.gl { padding: 6px 12px; border-radius: 16px; font-size: 13px; }
.gl:hover { background: var(--hover); }
.gsign { padding: 7px 20px; border-radius: 18px; font-size: 13px; font-weight: 500; background: var(--accent); color: #fff; margin: 0 8px; }
.gsign:hover { filter: brightness(1.08); }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 10px; border-radius: 16px; color: var(--muted); font-size: 13px; }
.chip:hover { background: var(--hover); color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.dot.ready { background: var(--ok); }
.dot.loading, .dot.transcribing { background: var(--warn); animation: pulse 1s infinite; }
.dot.recording { background: var(--rec); animation: pulse .6s infinite; }
.dot.error { background: var(--rec); }
@keyframes pulse { 50% { opacity: .35; } }

.center { width: 100%; max-width: 640px; padding: 0 24px; margin-top: min(8vh, 90px); display: flex; flex-direction: column; align-items: center; }
.logo { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
.logo img { width: 88px; height: 88px; }
.logo b { font-size: 44px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tagline { margin-bottom: 26px; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); }
.box { width: 100%; height: 48px; border-radius: 24px; background: var(--field); display: flex; align-items: center; gap: 12px; padding: 0 20px; color: var(--muted); }
.box:hover { box-shadow: var(--shadow); }
.box:focus-within { background: var(--panel); box-shadow: var(--shadow), inset 0 0 0 2px var(--accent); }
.box svg { width: 20px; height: 20px; flex: none; }
.box input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; }
.box input::placeholder { color: var(--muted); }

.tiles { margin-top: 28px; display: grid; grid-template-columns: repeat(5, 112px); gap: 4px 8px; justify-content: center; }
.tile { position: relative; width: 112px; padding: 10px 0 8px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tile:hover { background: var(--hover); }
.tile .av { width: 44px; height: 44px; border-radius: 50%; background: var(--field); display: grid; place-items: center; font-size: 20px; font-weight: 500; color: #fff; overflow: hidden; }
.tile .av img { width: 28px; height: 28px; border-radius: 4px; }
.tile .nm { max-width: 100px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .rm { position: absolute; top: 4px; right: 6px; width: 24px; height: 24px; border-radius: 50%; display: none; place-items: center; color: var(--muted); }
.tile .rm svg { width: 12px; height: 12px; }
.tile:hover .rm { display: grid; }
.tile .rm:hover { background: var(--hover); color: var(--text); }

.dictation { margin: 28px 0 28px; display: flex; align-items: center; gap: 16px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); max-width: 560px; }
.dictation .mic { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.dictation .mic svg { width: 22px; height: 22px; }
.dictation.recording .mic { background: var(--rec); animation: ring 1.2s infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(217,48,37,.4); } 100% { box-shadow: 0 0 0 14px rgba(217,48,37,0); } }
.dictation .tx { flex: 1; min-width: 0; }
.dictation b { display: block; font-weight: 500; }
.dictation span { color: var(--muted); font-size: 13px; }
kbd { font: inherit; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); border-bottom-width: 2px; color: var(--text); background: var(--bg); }
.dictation a.go { color: var(--accent); font-weight: 500; white-space: nowrap; padding: 6px 10px; border-radius: 16px; }
.dictation a.go:hover { background: var(--accent-soft); }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(3, 112px); } }
</style>
</head>
<body>
<div class="top">
  <a class="gl" href="https://mail.google.com/">Gmail</a>
  <a class="gsign" id="gsign" href="https://accounts.google.com/ServiceLogin?service=mail&amp;continue=https://mail.google.com/mail/">Sign in</a>
  <a class="chip" href="index.html" title="Open the Vexon dictation dashboard"><span class="dot" id="dot"></span><span id="status">Vexon</span></a>
</div>

<div class="center">
  <div class="logo"><img src="icon.png" alt=""><b>Vexon</b></div>
  <div class="tagline">Beyond the ordinary</div>
  <form class="box" id="form" autocomplete="off">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" spellcheck="false" placeholder="Search the web or type a URL" aria-label="Search the web or type a URL">
  </form>

  <div class="tiles" id="tiles"></div>

  <div class="dictation" id="dict">
    <div class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg></div>
    <div class="tx"><b id="d-title">Dictation</b><span id="d-sub">Hold <span id="hk"></span> and speak. The text is typed into the app you are using.</span></div>
    <a class="go" href="index.html">Open dashboard</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEFAULTS = [
  {title: 'Gmail', url: 'https://mail.google.com/'}, {title: 'YouTube', url: 'https://www.youtube.com/'}, {title: 'Wikipedia', url: 'https://www.wikipedia.org/'},
  {title: 'GitHub', url: 'https://github.com/'}, {title: 'Google', url: 'https://www.google.com/'},
  {title: 'Maps', url: 'https://www.google.com/maps'}, {title: 'News', url: 'https://news.google.com/'},
];
const COLORS = ['#a855f7', '#0891b2', '#7c3aed', '#06b6d4', '#c026d3', '#8b5cf6', '#0e7490', '#6d28d9'];
let api, hidden = [];
try { hidden = JSON.parse(localStorage.getItem('vt.hiddenTiles') || '[]'); } catch (e) {}
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const KEYS = {ctrl: 'Ctrl', windows: 'Win', alt: 'Alt', shift: 'Shift', space: 'Space', 'right ctrl': 'Right Ctrl'};
const keysHtml = c => (c || '').split('+').map(k => `<kbd>${esc(KEYS[k.trim()] || k.trim().toUpperCase())}</kbd>`).join(' + ');

$('#form').onsubmit = e => { e.preventDefault(); const v = $('#q').value.trim(); if (v) api.navigate(v); };

async function loadTiles() {
  const seen = new Set(), tiles = [];
  const add = t => { const h = host(t.url); if (!seen.has(h) && !hidden.includes(h) && tiles.length < 10) { seen.add(h); tiles.push({...t, host: h}); } };
  (await api.top_sites(10)).forEach(t => add({title: t.title, url: t.url, icon: t.icon}));
  (await api.get_bookmarks()).forEach(b => add({title: b.title, url: b.url, icon: b.icon}));
  DEFAULTS.forEach(add);
  $('#tiles').innerHTML = tiles.map(t => {
    const letter = ((t.title || t.host).match(/[A-Za-z0-9]/) || ['•'])[0].toUpperCase();
    const color = COLORS[[...t.host].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
    const av = t.icon ? `<span class="av" style="background:var(--field)"><img src="${esc(t.icon)}" alt="" onerror="this.parentNode.style.background='${color}';this.replaceWith('${letter}')"></span>`
                      : `<span class="av" style="background:${color}">${esc(letter)}</span>`;
    const name = t.title.length > 18 ? t.title.slice(0, 17) + '…' : t.title;
    return `<a class="tile" href="${esc(t.url)}" title="${esc(t.url)}">${av}<span class="nm">${esc(name)}</span>
      <button class="rm" data-h="${esc(t.host)}" title="Remove" aria-label="Remove shortcut"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></a>`;
  }).join('');
}
$('#tiles').addEventListener('click', e => {
  const rm = e.target.closest('.rm'); if (!rm) return;
  e.preventDefault(); e.stopPropagation();
  hidden.push(rm.dataset.h);
  try { localStorage.setItem('vt.hiddenTiles', JSON.stringify(hidden)); } catch (err) {}
  loadTiles();
});

function setState(state, status) {
  $('#dot').className = 'dot ' + state;
  $('#status').textContent = status;
  $('#dict').classList.toggle('recording', state === 'recording');
  $('#d-title').textContent = state === 'recording' ? 'Listening…' : state === 'transcribing' ? 'Transcribing…' : 'Dictation';
}
window.onEngineEvent = (event, data) => {
  if (event === 'state') setState(data.state, data.status);
  if (event === 'config') $('#hk').innerHTML = keysHtml(data.hotkey);
  if (event === 'bookmarks') loadTiles();
};
window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  const s = await api.get_state();
  setState(s.state, s.status);
  $('#hk').innerHTML = keysHtml(s.config.hotkey);
  loadTiles();
  // the "Sign in" button only makes sense while no Google account is signed in
  api.google_account().then(g => { $('#gsign').classList.toggle('hidden', g.signed_in); $('#gsign').href = g.sign_in_url; });
});
</script>
</body>
</html>
